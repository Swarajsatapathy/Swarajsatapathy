  </text>

  <g transform="translate(105,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ●
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      1
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
    >
      Current Streak
    </text>
  </g>

  <g transform="translate(265,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ◆
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      6
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
    >
      Longest Streak
    </text>
  </g>

  <g transform="translate(425,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ⌁
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      157
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
    >
      Contributions
    </text>
  </g>

  <!-- RIGHT -->
  <rect
    x="550"
    y="0"
    width="530"
    height="125"
    rx="2"
    fill="#000000"
  />

  <text
    x="570"
    y="27"
    class="title"
  >
    GitHub Stats
  </text>

  <g transform="translate(655,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ★
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      7
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
    >
      Stars
    </text>
  </g>

  <g transform="translate(815,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ⌁
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      143
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
    >
      Commits
    </text>
  </g>

  <g transform="translate(975,0)">
    <text
      x="0"
      y="57"
      text-anchor="middle"
      class="icon"
    >
      ▣
    </text>

    <text
      x="0"
      y="81"
      text-anchor="middle"
      class="value"
    >
      17
    </text>

    <text
      x="0"
      y="103"
      text-anchor="middle"
      class="label"
