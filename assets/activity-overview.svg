
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1080"
  height="130"
  viewBox="0 0 1080 130"
>
  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;
      font-weight: 700;
      fill: #ffffff;
    }

    .icon {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      fill: #ffffff;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 20px;
      font-weight: 700;
      fill: #ffffff;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 10px;
      fill: #8b949e;
    }
  </style>

  <!-- LEFT -->
  <rect
