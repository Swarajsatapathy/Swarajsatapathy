name: Update Activity Cards

on:
  workflow_dispatch:

  schedule:
    - cron: "15 0 * * *"
      timezone: "Asia/Kolkata"

  push:
    paths:
      - "scripts/generate-activity.mjs"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate activity cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Swarajsatapathy
        run: node scripts/generate-activity.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-streak.svg
          git add assets/activity-github.svg

          if git diff --cached --quiet; then
            echo "No stats changed."
            exit 0
          fi

          git commit -m "chore: update activity stats"
          git push